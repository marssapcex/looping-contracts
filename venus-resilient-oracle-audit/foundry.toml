[profile.default]
src = 'contracts'
test = 'poc'
out = 'out'
libs = ['../.audit-tools/venus-oracle-build/node_modules', '../lib']
cache_path = '../.audit-tools/venus-oracle-cache'
solc = 'scripts/solc'
via_ir = false
optimizer = true
optimizer_runs = 200
evm_version = 'cancun'
use_literal_content = true
remappings = [
  'forge-std/=../lib/forge-std/src/',
  '@openzeppelin/contracts-upgradeable/=../.audit-tools/venus-oracle-build/node_modules/@openzeppelin/contracts-upgradeable/',
  '@openzeppelin/contracts/=../.audit-tools/venus-oracle-build/node_modules/@openzeppelin/contracts/',
  '@venusprotocol/governance-contracts/=../.audit-tools/venus-oracle-build/node_modules/@venusprotocol/governance-contracts/'
]

[profile.ci]
fuzz = { runs = 1000, max_test_rejects = 10000 }
