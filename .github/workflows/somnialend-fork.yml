name: SomniaLend pinned economic fork

on:
  workflow_dispatch:
    inputs:
      block:
        description: Somnia block; blank pins the current RPC block at run time
        required: false
        default: ""
      rpc_url:
        description: Somnia JSON-RPC endpoint
        required: false
        default: "https://api.infra.mainnet.somnia.network"
  push:
    branches: [arena/ee2289ba-looping-contracts]
    paths:
      - .github/workflows/somnialend-fork.yml
      - somnialend-audit/src/**
      - somnialend-audit/test/**
      - somnialend-audit/foundry.toml
      - somnialend-audit/run-fork.sh

permissions:
  contents: write

concurrency:
  group: somnialend-fork-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fork:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FOUNDRY_VERSION: "1.7.1"
    steps:
      - name: Check out branch and forge-std
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Forge 1.8+ sends EIP-1898 block objects on every fork state read; the Somnia RPC rejects
      # them with -32602, so the fork dies on the first account read. 1.7.1 sends hex block numbers.
      - name: Install pinned Foundry (RPC compatibility)
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: ${{ env.FOUNDRY_VERSION }}

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pure-JS solc
        run: npm ci --prefix somnialend-audit/tools --no-audit --no-fund

      - name: Compile harness
        working-directory: somnialend-audit
        run: forge build

      - name: Offline harness unit tests (not evidence)
        working-directory: somnialend-audit
        run: forge test --match-contract SomniaLendHarnessUnitTest -vv

      - name: Select and pin Somnia state
        id: pin
        env:
          REQUESTED_RPC: ${{ inputs.rpc_url }}
          REQUESTED_BLOCK: ${{ inputs.block }}
        run: |
          set -euo pipefail
          RPC="${REQUESTED_RPC:-https://api.infra.mainnet.somnia.network}"
          BLOCK="$REQUESTED_BLOCK"
          test "$(cast chain-id --rpc-url "$RPC")" = "5031"
          if [ -z "$BLOCK" ]; then BLOCK="$(cast block-number --rpc-url "$RPC")"; fi
          test -n "$BLOCK"
          cast code 0xEC6758e6324c167DB39B6908036240460a2b0168 --block "$BLOCK" --rpc-url "$RPC" | grep -qv '^0x$'
          echo "Pinned Somnia block: $BLOCK"
          echo "SOMNIA_RPC_URL=$RPC" >> "$GITHUB_ENV"
          echo "SOMNIA_FORK_BLOCK=$BLOCK" >> "$GITHUB_ENV"
          echo "block=$BLOCK" >> "$GITHUB_OUTPUT"

      - name: Recon reserves, feeds, books
        id: recon
        if: always()
        working-directory: somnialend-audit
        run: |
          set -o pipefail
          mkdir -p evidence results
          ./run-fork.sh recon

      - name: No-trade flashloan control
        id: control
        if: always()
        working-directory: somnialend-audit
        run: |
          set -o pipefail
          ./run-fork.sh control

      - name: Atomic zero-seed sweep
        id: sweep
        if: always()
        working-directory: somnialend-audit
        run: |
          set -o pipefail
          ./run-fork.sh sweep

      - name: Record explicit outcomes
        if: always()
        run: |
          OUT="somnialend-audit/evidence/outcomes-${{ steps.pin.outputs.block }}.txt"
          {
            echo "Somnia fork block: ${{ steps.pin.outputs.block }}"
            echo "run: ${{ github.run_id }} attempt ${{ github.run_attempt }}"
            echo "forge: ${{ env.FOUNDRY_VERSION }}"
            echo "recon: ${{ steps.recon.outcome }}"
            echo "control: ${{ steps.control.outcome }}"
            echo "sweep: ${{ steps.sweep.outcome }}"
            echo "A failed sweep step means no scenario returned a successful, repaid, positive-P&L"
            echo "transaction. It is never reported as a mitigated or exploitable finding by itself."
          } | tee "$OUT"
          cat "$OUT" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: somnialend-fork-${{ steps.pin.outputs.block }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            somnialend-audit/evidence/
            somnialend-audit/results/*.json

      # The sandbox that built this harness cannot reach the Somnia RPC, so CI commits the raw
      # evidence back to the branch. [skip ci] stops a self-retrigger loop.
      - name: Commit evidence to branch
        if: always()
        run: |
          set -euo pipefail
          git config user.name "arena-agent"
          git config user.email "297053741+arena-agent@users.noreply.github.com"
          git add somnialend-audit/evidence somnialend-audit/results
          if git diff --cached --quiet; then
            echo "no new evidence"
            exit 0
          fi
          git commit -m "Add SomniaLend fork evidence for block ${{ steps.pin.outputs.block }} [skip ci]"
          for i in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break
            sleep 5
          done
