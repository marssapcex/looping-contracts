[profile.default]
src = "contracts"
test = "poc"
out = "out"
libs = ["../lib", "node_modules"]
solc = "scripts/solc"
optimizer = true
optimizer_runs = 200
evm_version = "istanbul"
fs_permissions = [{ access = "read", path = "./evidence" }]
remappings = [
  "forge-std/=../lib/forge-std/src/",
  "@openzeppelin/=node_modules/@openzeppelin/"
]

[profile.ci]
fuzz = { runs = 1000 }
