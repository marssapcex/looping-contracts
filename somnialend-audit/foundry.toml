[profile.default]
src = "src"
test = "test"
out = "out"
cache_path = "cache"
libs = ["../lib"]
solc = "tools/solc"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
ignored_error_codes = [3860, 5574]
fs_permissions = [{ access = "read-write", path = "results" }]
remappings = ["forge-std/=../lib/forge-std/src/"]

[rpc_endpoints]
somnia = "${SOMNIA_RPC_URL}"
