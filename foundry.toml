[profile.default]
src = 'contracts'
out = 'out'
libs = ['node_modules', 'lib']
test = 'poc'
cache_path = '.audit-tools/cache'
solc = 'scripts/solc'
via_ir = true
remappings = [
  'forge-std/=lib/forge-std/src/',
  '@openzeppelin/=node_modules/@openzeppelin/'
]

[profile.ci]
fuzz = { runs = 1_000, max_test_rejects = 10_000 }
invariant = { runs = 32, depth = 16, fail_on_revert = false }
